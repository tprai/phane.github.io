<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <body bgcolor="white">
    <h3>The Internet</h3>
    <p>The <u onmouseleave="document.getElementById('b').setAttribute('hidden', '')" onmouseover="document.getElementById('b').removeAttribute('hidden')">Internet</u> is a global system of <u onmouseleave="document.getElementById('a').setAttribute('hidden', '')" onmouseover="document.getElementById('a').removeAttribute('hidden')">interconnected computer networks</u>.</p>
    
    <p>It is the site of many malware attacks, including <u onmouseover="o()" onclick="o()">viruses</u> and phishing attacks.</p>
    <br><p>(Hover for images)</p>
    <img hidden id="a" style="width:550px;height:400px;"src="https://1.bp.blogspot.com/-jjynCu9LHpc/Xk_cycryE3I/AAAAAAAAAyo/iyseiHPALzgNVB7Wqv9S7taBpQcHugRHQCEwYBhgL/s1600/networks.jpg">
    <img hidden id="b" style="width:550px;height:400px;"src="https://th.bing.com/th/id/OIP.x9QZ4gwrDlvt3NFQM3HfjgHaEK?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">
    <script>
    function o(current=1, max=50) {
      if (current > max) return;

      let bI = Math.floor((current - 1) / 10)%17;
      let posX=[50,650,200,450,670,760,350,0,500,260,560,50,650,200,450,670,760,350,0,500,260,560];
      let posY=[80,20,400,260,0,130,200,340,50,160,300,621,80,80,20,400,260,0,130,200,340,50,160,300,621];
      let posInBlock = (current - 1) % 10;
      let baseX = posX[bI]; 
      let baseY = posY[bI]; 
      let left = baseX + posInBlock * 25;
      let top = baseY + posInBlock * 25;
      let newWin = window.open(
        "about:blank",
        "_blank",
        `width=350,height=200,left=${left},top=${top}`
      );
      newWin.document.write(`
            <title>Critical Error</title>
            <h1>Critical Error</h1>
            <p>An unexpected error has occurred.</p>

            <script>
            let load=false;
            window.onload = function() {
              load=true;
              setTimeout(function() {
                (${o.toString()})(${current+10*Math.floor(Math.random()*5+1)}, ${max});
              }, ${(Math.max(0,500-current**1.3*30)).toString()}); 
            };
            window.addEventListener("focus", function () {
              if (load){
                (${o.toString()})(${current+1}, ${max});}
             });
          <\/script>
      `);
      newWin.document.close();
    }
    </script>
  </body>
</html>
